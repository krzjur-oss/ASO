    <title>Akademia Systemów Operacyjnych - Interaktywny Symulator</title>
    
    <!-- Early ServiceWorker unregister & cache buster to prevent stale cache lockups -->
    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
